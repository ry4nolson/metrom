# Cloudflare Workers (static assets) for Metrom marketing site.
#
# Matches dashboard: Deploy command = npx wrangler deploy, Root directory = /website
#
# After push to main, trigger a redeploy (or: cd website && npx wrangler deploy)
#
# Custom domain: attach metrom.dev in Workers & Pages → metrom → Domains
# Optional: Email Routing for support@metrom.dev

name = "metrom"
compatibility_date = "2026-08-06"

[assets]
directory = "."
html_handling = "auto-trailing-slash"
